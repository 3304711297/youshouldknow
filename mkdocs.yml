site_name: YouShouldKnow
site_description: Windows 系统、硬件、游戏性能与日常使用知识库
site_url: https://3304711297.github.io/youshouldknow/
repo_url: https://github.com/3304711297/youshouldknow
edit_uri: edit/main/
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - 首页: README.md
  - 验机相关: 验机相关/
  - BIOS与固件: BIOS与固件/
  - 系统知识: 系统知识/
  - CPU与延迟: CPU与延迟/
  - GPU与显示: GPU与显示/
  - 内存与存储: 内存与存储/
  - 内存超频: 内存超频/
  - 系统调优与安全: 系统调优与安全/
  - 显卡优化: 显卡优化/
  - 笔电相关: 笔电相关/
  - 网络通信: 网络通信/
  - 软件技巧: 软件技巧/
  - 项目导航: 项目导航/
