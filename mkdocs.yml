site_name: YouShouldKnow
site_description: Windows 系统、硬件、游戏性能与日常使用知识库
site_url: https://3304711297.github.io/youshouldknow/
repo_url: https://github.com/3304711297/youshouldknow
edit_uri: edit/main/
# 内容位于 docs/（标准 MkDocs 布局）；修订日期插件读取真实文件的 git 历史
theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - meta
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
# P2-13/P2-15：页面顶部徽章（applies_to/risk/tweak_module → Material admonition）
# 与 Material tags 注入；纯渲染层 hook，不改变既有构建链路
hooks:
  - hooks/badges.py
plugins:
  - search:
      lang: zh
  # P2-15:Material 内置 tags 插件——页面 tags 由 hooks/badges.py 注入 page.meta['tags']
  - material/tags:
      tags: false
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: false
  - redirects:
      redirect_maps:
        'CPU与延迟/DPC与ISR延迟机制.md': 'CPU与延迟/CPU调度与游戏线程.md'
        'CPU与延迟/Windows延迟来源与性能测试方法.md': 'CPU与延迟/CPU调度与游戏线程.md'
        'CPU与延迟/Windows计时器机制与输入延迟.md': 'CPU与延迟/CPU调度与游戏线程.md'
        'CPU与延迟/Windows调度与游戏性能.md': 'CPU与延迟/CPU调度与游戏线程.md'
        'GPU与显示/Windows驱动模型与性能影响.md': 'GPU与显示/Windows图形管线与帧时间.md'
        '系统知识/Windows优化前准备与风险等级.md': '系统调优与安全/Windows优化原则与风险.md'
        '系统知识/Windows优化误区.md': '系统调优与安全/Windows优化原则与风险.md'
        '系统知识/排查阻止Windows自动睡眠的程序.md': '系统知识/电源计划创建与优化指南.md'
        '系统调优与安全/优化等级说明.md': '系统调优与安全/Windows优化原则与风险.md'
