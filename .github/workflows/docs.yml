name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build site
        run: mkdocs build --strict

  front-matter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt
      - name: Test Front Matter checker
        run: python -m unittest tools/test_check_front_matter.py
      - name: Check Front Matter
        run: python tools/check_front_matter.py

  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check markdown links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml "./**/*.md"
          fail: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 必须同时等待 link-check:链接检查失败时不得部署,
    # 否则死链会静默上线(lychee 的 fail:true 只能让 link-check 自己变红)
    needs: [build, link-check, front-matter-check]
    # 部署互斥:连续 main push 时,新部署开始会取消进行中的旧部署,
    # 防止旧提交的 gh-deploy --force 晚到并把线上站点回退到旧版本
    concurrency:
      group: docs-deploy-${{ github.repository }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force --strict
