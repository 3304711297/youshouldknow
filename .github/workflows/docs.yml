name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.lock.txt
      - name: Install MkDocs
        run: python -m pip install --require-hashes -r requirements-docs.lock.txt
      - name: Verify coverage matrix is in sync
        run: python scripts/gen-matrix.py --check
      - name: Build site
        run: mkdocs build --strict
      - name: Upload verified site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mkdocs-site-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 7

  front-matter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.lock.txt
      - name: Install documentation dependencies
        run: python -m pip install --require-hashes -r requirements-docs.lock.txt
      - name: Test tools (Front Matter checker & Bilibili watch)
        run: python -m unittest discover tools
      - name: Check Front Matter
        run: python tools/check_front_matter.py
      - name: Check coverage matrix
        run: python scripts/gen-matrix.py --check

  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check markdown links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --config lychee.toml "./**/*.md"
          fail: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 必须同时等待 link-check:链接检查失败时不得部署,
    # 否则死链会静默上线(lychee 的 fail:true 只能让 link-check 自己变红)
    needs: [build, link-check, front-matter-check]
    # 部署互斥:连续 main push 时,新部署开始会取消进行中的旧部署,
    # 防止旧提交的 gh-deploy --force 晚到并把线上站点回退到旧版本
    concurrency:
      group: docs-deploy-${{ github.repository }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.lock.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mkdocs-site-${{ github.sha }}
          path: site
      - name: Install deployment dependency
        run: python -m pip install --require-hashes -r requirements-docs.lock.txt
      - name: Deploy verified site artifact to gh-pages
        run: ghp-import --push --force --message "Deploy ${{ github.sha }}" site
