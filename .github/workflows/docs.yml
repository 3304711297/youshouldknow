name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.lock.txt
      - name: Install MkDocs
        run: python -m pip install --require-hashes -r requirements-docs.lock.txt
      - name: Build site
        run: mkdocs build --strict
      - name: Upload verified site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mkdocs-site-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 7

  front-matter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.lock.txt
      - name: Install documentation dependencies
        run: python -m pip install --require-hashes -r requirements-docs.lock.txt
      - name: Test Front Matter checker
        run: python -m unittest tools/test_check_front_matter.py
      - name: Check Front Matter
        run: python tools/check_front_matter.py

  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check markdown links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --config lychee.toml "./**/*.md"
          fail: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 必须同时等待 link-check:链接检查失败时不得部署,
    # 否则死链会静默上线(lychee 的 fail:true 只能让 link-check 自己变红)
    needs: [build, link-check, front-matter-check]
    # 部署互斥:连续 main push 时,新部署开始会取消进行中的旧部署,
    # 防止旧提交的 gh-deploy --force 晚到并把线上站点回退到旧版本
    concurrency:
      group: docs-deploy-${{ github.repository }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.lock.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mkdocs-site-${{ github.sha }}
          path: site
      - name: Install deployment dependency
        run: python -m pip install --require-hashes -r requirements-docs.lock.txt
      - name: Deploy verified site artifact to gh-pages
        run: ghp-import --push --force --message "Deploy ${{ github.sha }}" site
