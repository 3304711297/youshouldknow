# lychee 死链检查配置
# 只有真正的成功响应算可达；403/429 不能被静默视为成功。
# 被明确排除的域名仍需人工复核，不能当作自动检查通过。

max_retries = 3
retry_wait_time = 2
timeout = 20

accept = ["200..=299"]

# 连接层失败或明确拒绝自动探测的域名按域名显式排除。
exclude = [
  'https://www\.grc\.com/',
  'https://profileinspector\.io/',
  'https://blog\.csdn\.net/',
  'https://bbs\.nga\.cn/',
  'https://ngabbs\.com/',
  'https://www\.chiphell\.com/',
  'https://www\.overclock\.net/',
  # 联想知识库:CI(美国 runner)持续超时,20s×3 次尝试均未返回
  'https://iknow\.lenovo\.com\.cn/',
  # 以下站点在 CI runner 上稳定返回 403，按域名排除并保留人工复核责任
  'https://www\.intel\.com/',
  'https://community\.intel\.com/',
  'https://nvidia\.custhelp\.com/',
  'https://videocardz\.com/',
  'https://www\.reddit\.com/',
  'https://cs\.stackexchange\.com/',
  'https://forum\.dcs\.world/',
  'https://wccftech\.com/',
  'https://blurbusters\.com/',
  'https://forums\.blurbusters\.com/',
  'https://forums\.guru3d\.com/',
  'https://help\.xmg\.gg/',
  'https://www\.tenforums\.com/',
  'https://h30471\.www3\.hp\.com/',
  'https://www\.atera\.com/',
  'https://dokumen\.pub/',
  'https://www\.elevenforum\.com/',
  'https://forum-en\.msi\.com/',
  'https://zhuanlan\.zhihu\.com/',
  'https://superuser\.com/',
  # 2026-08-29 起 CI runner 访问返回 403(此前正常),见 tools/lychee-excluded-domains.md
  'https://forums\.tomshardware\.com/',
  'https://techcommunity\.microsoft\.com/',
  'https://www\.asus\.com/',
  'https://www\.digitalfoundry\.net/',
  'https://cn\.game-console\.org/',
  # 2026-08-29 起对 CI runner 返回 412(反爬前置校验,本地可达),见台账
  'https://www\.bilibili\.com/',
  'https://b23\.tv/',
  # 2026-09-04 起 Cloudflare 防护对 CI runner 返回 503/限流
  'https://www\.bleepingcomputer\.com/',

  # 2026-09-05 起 WAF 阻断对 CI runner 与 lychee 返回 403
  'https://www\.nccgroup\.com/',
  # 2026-09-06 起 FirPE 官网对海外 CI runner 连接超时/阻断
  'https://firpe\.cn/',
  # 2026-09-09 起 Cloudflare WAF 对 CI runner 与自动化请求返回 403
  'https://linustechtips\.com/',
  # 2026-09-14 起 Newegg 官网对海外 CI runner 请求连接超时/阻断
  'https://www\.newegg\.com/',
  # 2026-09-14 起 GitHub 前端边缘对 CI runner 并发请求 blob 页面返回 503 限流
  'https://github\.com/3304711297/tweakbyjie/blob/',
  'https://github\.com/KaringX/karing-docu/blob/',
  # 2026-09-24 起 bswaterb 原站离线且 Internet Archive 历史快照回放返回 404（CDX 索引存在但服务不稳定）
  'https?://web\.archive\.org/.*bswaterb\.club',
  # 2026-09-25 起 Cloudflare WAF 对 CI runner 返回 522/403 阻断
  'https://www\.starwindsoftware\.com/',
]

# 按站点限流（放在文件末尾：TOML 表段之后的键会归入该表，故必须在所有顶层键声明之后）。
# 2026-09-15：community.spiceworks.com 对 CI runner 并发请求返回 429（瞬时限流，
# 非永久阻断）。lychee 官方建议按站点降并发 + 加请求间隔，而不是排除域名
# （排除会掩盖将来真正的死链）。见 tools/lychee-excluded-domains.md 的复核原则。
[hosts."community.spiceworks.com"]
concurrency = 1
request_interval = "3s"
